name: ci

on:
  push:
  pull_request:

jobs:
  zig-version:
    name: resolve pinned zig version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "version=$(cat ZIG_VERSION)" >> "$GITHUB_OUTPUT"

  hermetic:
    name: go test (no C toolchain)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -timeout 60m ./...
      - run: go test -run 'Fuzz' -fuzz 'Fuzz' -fuzztime 20s ./internal/syntax/

  race:
    name: race (${{ matrix.pkg }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pkg: [syntax, sem, mir, vm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go test -race ./internal/${{ matrix.pkg }}/...

  audit:
    name: test audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go run ./cmd/testaudit -out test-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: test-audit
          path: test-audit.json

  aot:
    name: AOT with pinned zig
    needs: zig-version
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ needs.zig-version.outputs.version }}
      - run: go test -timeout 60m ./internal/driver/
      - run: KIGUMI_CFLAGS=-DKIGUMI_RC_CHECK go test -timeout 60m ./internal/driver/
      - run: KIGUMI_CFLAGS='-fsanitize=address,undefined -g' go test -timeout 60m -run 'TestAotCorpus|TestAotFFI|TestAotDL|TestAotAsm' ./internal/driver/
      # internal/cli and internal/testtool each have one native-toolchain test, skipped by the hermetic job above.
      - run: go test -timeout 10m ./internal/cli/... ./internal/testtool/...

  benchmarks:
    name: benchmarks (observation only)
    needs: zig-version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ needs.zig-version.outputs.version }}
      # The Go microbenchmarks, as Go's own versioned test2json.
      - run: go test -run '^$' -bench . -benchtime=1x -json ./internal/syntax/ ./internal/sem/ ./internal/mir/ ./internal/vm/ ./internal/llgen/ > bench-micro.json
      # The process-level runner, as versioned JSON Lines.
      - run: go run ./cmd/e2ebench -module examples/fizzbuzz > bench-e2e.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks-${{ github.sha }}
          path: |
            bench-micro.json
            bench-e2e.jsonl

  editor:
    name: VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm package
        working-directory: editors/vscode

  # The reusable workflow other Kigumi repositories call, exercised on an
  # example module with the toolchain built from this checkout.
  module:
    needs: zig-version
    uses: ./.github/workflows/kigumi-test.yml
    with:
      module-root: examples/repostat
      kigumi-version: local
      zig-version: ${{ needs.zig-version.outputs.version }}
