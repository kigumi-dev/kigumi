name: ci

on:
  push:
  pull_request:

jobs:
  zig-version:
    name: resolve pinned zig version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "version=$(cat ZIG_VERSION)" >> "$GITHUB_OUTPUT"

  hermetic:
    # The corpus runs are split across shards: KIGUMI_TEST_SHARD selects one
    # slice of every testdata/**.txtar loop, so the wall time is the slowest
    # shard instead of the sum. Unit tests run in every shard.
    name: go test (no C toolchain, shard ${{ matrix.index }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        index: ["0", "1", "2", "3"]
    env:
      KIGUMI_TEST_SHARD: ${{ matrix.index }}/4
      # TestCorpus* and the CLI/devkit native tests must see the no-toolchain path even though
      # the runner image ships clang; internal/toolchain/config and internal/devkit/hosttool
      # honour this gate.
      KIGUMI_TEST_NO_CC: "1"
      # TestRunCorpusEngines also reruns each fixture of the shard under --secret-san.
      KIGUMI_SECRET_SAN_CORPUS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: test -z "$(gofmt -l .)"
      - run: go run . fmt --check std testdata examples
      - run: go vet ./...
      - run: go list ./... | grep -v '^kigumi/internal/toolchain/driver$' | xargs go test -timeout 60m
      - run: go test -timeout 60m -run "$(bash .github/scripts/shard_tests.sh ${{ matrix.index }} 4 kigumi/internal/toolchain/driver vm)" ./internal/toolchain/driver
      # The verifier's oracle: mutated MIR must never crash verify, llgen or the
      # VM. It needs no C toolchain, so the hermetic job can run it; the nightly
      # workflow keeps the longer pass.
      - run: go test -run '^$' -fuzz '^FuzzMutatedMIR$' -fuzztime 20s ./internal/toolchain/driver/
        if: matrix.index == '0'

  race:
    # KIGUMI_TEST_SHARD slices the corpus loops as in the hermetic job; the other tests run in every
    # shard. The VM corpus alone outgrew one 45-minute race run.
    name: race (${{ matrix.pkg }}, shard ${{ matrix.index }}/${{ matrix.count }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: compiler/syntax
            index: "0"
            count: "1"
          - pkg: compiler/sem
            index: "0"
            count: "2"
          - pkg: compiler/sem
            index: "1"
            count: "2"
          - pkg: compiler/mir
            index: "0"
            count: "2"
          - pkg: compiler/mir
            index: "1"
            count: "2"
          - pkg: backend/vm
            index: "0"
            count: "4"
          - pkg: backend/vm
            index: "1"
            count: "4"
          - pkg: backend/vm
            index: "2"
            count: "4"
          - pkg: backend/vm
            index: "3"
            count: "4"
          - pkg: backend/llgen
            index: "0"
            count: "1"
          # The driver runs parallel builds and the VM; it was the concurrency-heaviest package
          # missing from this matrix.
          - pkg: toolchain/driver
            index: "0"
            count: "4"
          - pkg: toolchain/driver
            index: "1"
            count: "4"
          - pkg: toolchain/driver
            index: "2"
            count: "4"
          - pkg: toolchain/driver
            index: "3"
            count: "4"
    env:
      KIGUMI_TEST_SHARD: ${{ matrix.index }}/${{ matrix.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # The race detector's shadow memory makes the corpus runs several times
      # slower than a plain build, so the default 10m test timeout is too short.
      - run: go test -race -timeout 45m ./internal/${{ matrix.pkg }}/...

  release-tool:
    name: release tool
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: test -z "$(gofmt -l .)"
        working-directory: .github/scripts/release
      - run: go vet ./...
        working-directory: .github/scripts/release
      - run: go test ./...
        working-directory: .github/scripts/release

  cross:
    # The release list now carries darwin and windows targets, so every such
    # target must keep compiling. The test binaries cannot run on this runner;
    # -c proves the platform build tags also cover the tests that exercise the
    # code, which a plain package build would not.
    name: cross-compile ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go build ./...
      - run: mkdir -p /tmp/cross-tests
      - run: go test -c -o /tmp/cross-tests/repl.test ./internal/tooling/repl
      - run: go test -c -o /tmp/cross-tests/replcli.test ./internal/cli/cmd/repl
      - run: go test -c -o /tmp/cross-tests/vm.test ./internal/backend/vm

  audit:
    name: test audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go run ./cmd/testaudit -out test-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: test-audit
          path: test-audit.json

  aot:
    name: AOT with pinned zig (${{ matrix.name }})
    needs: zig-version
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default-0
            cflags: 
            asan: ""
            index: "0"
            count: "4"
            driver: "yes"
            zig: "yes"
          - name: default-1
            cflags: 
            asan: ""
            index: "1"
            count: "4"
            driver: "yes"
            zig: "yes"
          - name: default-2
            cflags: 
            asan: ""
            index: "2"
            count: "4"
            driver: "yes"
            zig: "yes"
          - name: default-3
            cflags: 
            asan: ""
            index: "3"
            count: "4"
            driver: "yes"
            zig: "yes"
          - name: rc-check-0
            cflags: -DKIGUMI_RC_CHECK
            asan: ""
            index: "0"
            count: "4"
            driver: "yes"
            zig: "yes"
          - name: rc-check-1
            cflags: -DKIGUMI_RC_CHECK
            asan: ""
            index: "1"
            count: "4"
            driver: "yes"
            zig: "yes"
          - name: rc-check-2
            cflags: -DKIGUMI_RC_CHECK
            asan: ""
            index: "2"
            count: "4"
            driver: "yes"
            zig: "yes"
          - name: rc-check-3
            cflags: -DKIGUMI_RC_CHECK
            asan: ""
            index: "3"
            count: "4"
            driver: "yes"
            zig: "yes"
          - name: sanitizers
            cflags: -fsanitize=address,undefined -g
            # The corpus exits through error paths that leave values unowned by design, and asks for
            # impossible allocation sizes to test the fallible API; ASan must not turn either into an abort.
            asan: detect_leaks=0:allocator_may_return_null=1
            index: "0"
            count: "1"
            driver: "no"
            zig: "no"
            # ASan cannot host the deliberate huge allocations (it refuses sizes past its limit and
            # prints a warning that breaks the expected stderr) or the stack-overflow fixtures (the
            # sanitizer's own frames change the depth). Everything else runs instrumented.
            cmd: >-
              go test -timeout 120m
              -run 'TestSanitizerRuntimeIsActive|TestRuntimeCUnitContracts|TestAotCorpus|TestAotFFI|TestAotDL|TestAotAsm'
              -skip '^TestAotCorpus/(alloc_error|alloc_huge_requests|array_bulk|entropy_bytes_huge|entropy_bytes_huge_size|std_net_conn_read_huge|stack_overflow_panic|stack_overflow_task_alloc|stack_overflow_task_drop|stack_overflow_task_map)\.txtar$'
              ./internal/toolchain/driver/
          # The zig-only tests outside the driver (internal/cli, internal/devkit/bench and the object
          # strip tests in internal/toolchain/native), which the hermetic job above skips.
          - name: cli
            cflags: ""
            asan: ""
            index: "0"
            count: "1"
            driver: "no"
            zig: "yes"
            cmd: go test -timeout 10m ./internal/cli/... ./internal/devkit/... ./internal/toolchain/native/...
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/cache@v4
        if: matrix.zig == 'yes'
        with:
          path: ~/.local/share/kigumi/zig
          key: kigumi-zig-${{ runner.os }}-${{ runner.arch }}-${{ needs.zig-version.outputs.version }}
      - run: go run . zig install ${{ needs.zig-version.outputs.version }}
        if: matrix.zig == 'yes'
      # The driver tests pick their C compiler from PATH; the installed store
      # holds the pinned zig, not the runner image's clang.
      - run: echo "$HOME/.local/share/kigumi/zig/${{ needs.zig-version.outputs.version }}" >> "$GITHUB_PATH"
        if: matrix.zig == 'yes'
      - if: matrix.driver == 'yes'
        run: go test -timeout 120m -run "$(bash .github/scripts/shard_tests.sh ${{ matrix.index }} ${{ matrix.count }} kigumi/internal/toolchain/driver aot)" ./internal/toolchain/driver/
        env:
          KIGUMI_CFLAGS: ${{ matrix.cflags }}
          ASAN_OPTIONS: ${{ matrix.asan }}
          KIGUMI_TEST_SHARD: ${{ matrix.index }}/${{ matrix.count }}
      - if: matrix.driver == 'no'
        run: ${{ matrix.cmd }}
        env:
          KIGUMI_CFLAGS: ${{ matrix.cflags }}
          ASAN_OPTIONS: ${{ matrix.asan }}
          KIGUMI_TEST_SHARD: ${{ matrix.index }}/${{ matrix.count }}

  uefi-boot:
    name: EFI link and boot (QEMU/OVMF)
    needs: zig-version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/kigumi/zig
          key: kigumi-zig-${{ runner.os }}-${{ runner.arch }}-${{ needs.zig-version.outputs.version }}
      - run: go run . zig install ${{ needs.zig-version.outputs.version }}
      - run: echo "$HOME/.local/share/kigumi/zig/${{ needs.zig-version.outputs.version }}" >> "$GITHUB_PATH"
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf
      - run: |
          OVMF=
          for f in /usr/share/ovmf/OVMF.fd /usr/share/OVMF/OVMF_CODE*.fd; do
            if [ -f "$f" ]; then OVMF=$f; break; fi
          done
          test -n "$OVMF"
          KIGUMI_UEFI_BOOT=1 OVMF="$OVMF" go test -run TestUEFIBoots -count=1 -timeout 10m ./internal/toolchain/driver/

  benchmarks:
    name: benchmarks (observation only)
    needs: zig-version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/kigumi/zig
          key: kigumi-zig-${{ runner.os }}-${{ runner.arch }}-${{ needs.zig-version.outputs.version }}
      - run: go run . zig install ${{ needs.zig-version.outputs.version }}
      # The Go microbenchmarks, as Go's own versioned test2json.
      - run: go test -run '^$' -bench . -benchtime=1x -json ./internal/compiler/syntax/ ./internal/compiler/sem/ ./internal/compiler/mir/ ./internal/backend/vm/ ./internal/backend/llgen/ > bench-micro.json
      # The process-level runner, as versioned JSON Lines.
      - run: go run ./cmd/e2ebench -module examples/fizzbuzz > bench-e2e.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks-${{ github.sha }}
          path: |
            bench-micro.json
            bench-e2e.jsonl

  editor:
    name: VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm package
        working-directory: editors/vscode

  # The reusable workflow other Kigumi repositories call, exercised on an
  # example module with the toolchain built from this checkout.
  module:
    needs: zig-version
    uses: ./.github/workflows/kigumi-test.yml
    with:
      module-root: examples/repostat
      kigumi-version: local
      zig-version: ${{ needs.zig-version.outputs.version }}
