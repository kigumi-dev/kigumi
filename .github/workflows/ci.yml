name: ci

on:
  push:
  pull_request:

jobs:
  zig-version:
    name: resolve pinned zig version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "version=$(cat ZIG_VERSION)" >> "$GITHUB_OUTPUT"

  hermetic:
    # The corpus runs are split across shards: KIGUMI_TEST_SHARD selects one
    # slice of every testdata/**.txtar loop, so the wall time is the slowest
    # shard instead of the sum. Unit tests run in every shard.
    name: go test (no C toolchain, shard ${{ matrix.index }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        index: ["0", "1", "2", "3"]
    env:
      KIGUMI_TEST_SHARD: ${{ matrix.index }}/4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go test -timeout 60m $(go list ./... | grep -v '^kigumi/internal/toolchain/driver$')
      - run: go test -timeout 60m -run "$(bash .github/scripts/shard_tests.sh ${{ matrix.index }} 4 kigumi/internal/toolchain/driver)" ./internal/toolchain/driver
      # The verifier's oracle: mutated MIR must never crash verify, llgen or the
      # VM. It needs no C toolchain, so the hermetic job can run it; the nightly
      # workflow keeps the longer pass.
      - run: go test -run '^$' -fuzz '^FuzzMutatedMIR$' -fuzztime 20s ./internal/toolchain/driver/
        if: matrix.index == '0'

  race:
    name: race (${{ matrix.pkg }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pkg: [compiler/syntax, compiler/sem, compiler/mir, backend/vm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # The race detector's shadow memory makes the corpus runs several times
      # slower than a plain build, so the default 10m test timeout is too short.
      - run: go test -race -timeout 45m ./internal/${{ matrix.pkg }}/...

  audit:
    name: test audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go run ./cmd/testaudit -out test-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: test-audit
          path: test-audit.json

  aot:
    name: AOT with pinned zig (${{ matrix.name }})
    needs: zig-version
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # The sanitizer pass is the only one that is not green yet: it now really runs ASan (see
    # TestSanitizerRuntimeIsActive) and reports leaks on error exits plus stack/allocator fixtures.
    # It stays non-blocking until the inventory in docs-new/roadmap.md P0-1 is fixed.
    continue-on-error: ${{ matrix.name == 'sanitizers' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default-0
            cflags: 
            asan: ""
            index: "0"
            count: "4"
            zig: "yes"
            cmd: go test -timeout 120m -run "$(bash .github/scripts/shard_tests.sh ${{ matrix.index }} ${{ matrix.count }} kigumi/internal/toolchain/driver)" ./internal/toolchain/driver/
          - name: default-1
            cflags: 
            asan: ""
            index: "1"
            count: "4"
            zig: "yes"
            cmd: go test -timeout 120m -run "$(bash .github/scripts/shard_tests.sh ${{ matrix.index }} ${{ matrix.count }} kigumi/internal/toolchain/driver)" ./internal/toolchain/driver/
          - name: default-2
            cflags: 
            asan: ""
            index: "2"
            count: "4"
            zig: "yes"
            cmd: go test -timeout 120m -run "$(bash .github/scripts/shard_tests.sh ${{ matrix.index }} ${{ matrix.count }} kigumi/internal/toolchain/driver)" ./internal/toolchain/driver/
          - name: default-3
            cflags: 
            asan: ""
            index: "3"
            count: "4"
            zig: "yes"
            cmd: go test -timeout 120m -run "$(bash .github/scripts/shard_tests.sh ${{ matrix.index }} ${{ matrix.count }} kigumi/internal/toolchain/driver)" ./internal/toolchain/driver/
          - name: rc-check-0
            cflags: -DKIGUMI_RC_CHECK
            asan: ""
            index: "0"
            count: "4"
            zig: "yes"
            cmd: go test -timeout 120m -run "$(bash .github/scripts/shard_tests.sh ${{ matrix.index }} ${{ matrix.count }} kigumi/internal/toolchain/driver)" ./internal/toolchain/driver/
          - name: rc-check-1
            cflags: -DKIGUMI_RC_CHECK
            asan: ""
            index: "1"
            count: "4"
            zig: "yes"
            cmd: go test -timeout 120m -run "$(bash .github/scripts/shard_tests.sh ${{ matrix.index }} ${{ matrix.count }} kigumi/internal/toolchain/driver)" ./internal/toolchain/driver/
          - name: rc-check-2
            cflags: -DKIGUMI_RC_CHECK
            asan: ""
            index: "2"
            count: "4"
            zig: "yes"
            cmd: go test -timeout 120m -run "$(bash .github/scripts/shard_tests.sh ${{ matrix.index }} ${{ matrix.count }} kigumi/internal/toolchain/driver)" ./internal/toolchain/driver/
          - name: rc-check-3
            cflags: -DKIGUMI_RC_CHECK
            asan: ""
            index: "3"
            count: "4"
            zig: "yes"
            cmd: go test -timeout 120m -run "$(bash .github/scripts/shard_tests.sh ${{ matrix.index }} ${{ matrix.count }} kigumi/internal/toolchain/driver)" ./internal/toolchain/driver/
          - name: sanitizers
            cflags: -fsanitize=address,undefined -g
            # The corpus exits through error paths that leave values unowned by design, and asks for
            # impossible allocation sizes to test the fallible API; ASan must not turn either into an abort.
            asan: detect_leaks=0:allocator_may_return_null=1
            index: "0"
            count: "1"
            zig: "no"
            cmd: go test -timeout 120m -run 'TestSanitizerRuntimeIsActive|TestAotCorpus|TestAotFFI|TestAotDL|TestAotAsm' ./internal/toolchain/driver/
          # internal/cli and internal/devkit/bench each have one native-toolchain test, skipped by the hermetic job above.
          - name: cli
            cflags: ""
            asan: ""
            index: "0"
            count: "1"
            zig: "yes"
            cmd: go test -timeout 10m ./internal/cli/... ./internal/devkit/...
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/cache@v4
        if: matrix.zig == 'yes'
        with:
          path: ~/.local/share/kigumi/zig
          key: kigumi-zig-${{ runner.os }}-${{ runner.arch }}-${{ needs.zig-version.outputs.version }}
      - run: go run . zig install ${{ needs.zig-version.outputs.version }}
        if: matrix.zig == 'yes'
      # The driver tests pick their C compiler from PATH; the installed store
      # holds the pinned zig, not the runner image's clang.
      - run: echo "$HOME/.local/share/kigumi/zig/${{ needs.zig-version.outputs.version }}" >> "$GITHUB_PATH"
        if: matrix.zig == 'yes'
      - run: ${{ matrix.cmd }}
        env:
          KIGUMI_CFLAGS: ${{ matrix.cflags }}
          ASAN_OPTIONS: ${{ matrix.asan }}
          KIGUMI_TEST_SHARD: ${{ matrix.index }}/${{ matrix.count }}

  benchmarks:
    name: benchmarks (observation only)
    needs: zig-version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/kigumi/zig
          key: kigumi-zig-${{ runner.os }}-${{ runner.arch }}-${{ needs.zig-version.outputs.version }}
      - run: go run . zig install ${{ needs.zig-version.outputs.version }}
      # The Go microbenchmarks, as Go's own versioned test2json.
      - run: go test -run '^$' -bench . -benchtime=1x -json ./internal/compiler/syntax/ ./internal/compiler/sem/ ./internal/compiler/mir/ ./internal/backend/vm/ ./internal/backend/llgen/ > bench-micro.json
      # The process-level runner, as versioned JSON Lines.
      - run: go run ./cmd/e2ebench -module examples/fizzbuzz > bench-e2e.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks-${{ github.sha }}
          path: |
            bench-micro.json
            bench-e2e.jsonl

  editor:
    name: VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm package
        working-directory: editors/vscode

  # The reusable workflow other Kigumi repositories call, exercised on an
  # example module with the toolchain built from this checkout.
  module:
    needs: zig-version
    uses: ./.github/workflows/kigumi-test.yml
    with:
      module-root: examples/repostat
      kigumi-version: local
      zig-version: ${{ needs.zig-version.outputs.version }}
