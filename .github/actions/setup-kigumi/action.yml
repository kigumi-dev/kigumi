name: Setup Kigumi
description: Install the kigumi toolchain, preferring the checksum-verified prebuilt release archive and falling back to a cached source build.
inputs:
  version:
    description: Git ref of the kigumi repository to build (branch, tag or commit), or `local` to build the checked-out workspace itself.
    default: master
  repository:
    description: Repository holding the toolchain, as owner/name.
    default: kigumi-org/kigumi
  go-version:
    description: Go version used when the toolchain is built from source.
    default: "1.26"
  zig-version:
    description: Zig version to install for `kigumi build` (native builds link with `zig cc`); empty installs none.
    default: ""
  prebuilt:
    description: >-
      Where to get a non-local toolchain: `auto` downloads the release archive
      when `version` is a tag with a published archive and otherwise builds from
      source; `true` requires the prebuilt archive; `false` always builds.
    default: auto
  checksums:
    description: Name of the checksum asset published next to the release archives.
    default: SHA256SUMS
outputs:
  commit:
    description: The commit the toolchain was built from.
    value: ${{ steps.resolve.outputs.commit }}
  source:
    description: "Where the toolchain came from: prebuilt or source."
    value: ${{ steps.install.outputs.source }}
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}
        cache: false
    - id: resolve
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        REPOSITORY: ${{ inputs.repository }}
      run: |
        set -euo pipefail
        src="$RUNNER_TEMP/kigumi-src"
        if [ "$VERSION" = local ]; then
          src="$GITHUB_WORKSPACE"
          commit=$(git -C "$src" rev-parse HEAD 2>/dev/null || echo "local-$(date +%s)")
        else
          mkdir -p "$src"
          git -C "$src" init -q
          git -C "$src" fetch -q --depth 1 "https://github.com/$REPOSITORY" "$VERSION"
          git -C "$src" checkout -q FETCH_HEAD
          commit=$(git -C "$src" rev-parse HEAD)
        fi
        echo "src=$src" >> "$GITHUB_OUTPUT"
        echo "commit=$commit" >> "$GITHUB_OUTPUT"
    - id: prebuilt
      if: inputs.version != 'local' && inputs.prebuilt != 'false'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        REPOSITORY: ${{ inputs.repository }}
        MODE: ${{ inputs.prebuilt }}
        CHECKSUMS: ${{ inputs.checksums }}
        RUNNER_OS_NAME: ${{ runner.os }}
        RUNNER_ARCH_NAME: ${{ runner.arch }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        echo "use=false" >> "$GITHUB_OUTPUT"
        case "$VERSION" in
          v[0-9]*) ;;
          *)
            if [ "$MODE" = true ]; then
              echo "prebuilt=true needs a release tag such as v0.1.0, got '$VERSION'" >&2
              exit 1
            fi
            exit 0
            ;;
        esac
        case "$RUNNER_OS_NAME" in
          Linux) os=linux ;;
          macOS) os=darwin ;;
          Windows) os=windows ;;
          *)
            if [ "$MODE" = true ]; then echo "no prebuilt archive for $RUNNER_OS_NAME" >&2; exit 1; fi
            exit 0
            ;;
        esac
        case "$RUNNER_ARCH_NAME" in
          X64) arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *)
            if [ "$MODE" = true ]; then echo "no prebuilt archive for $RUNNER_ARCH_NAME" >&2; exit 1; fi
            exit 0
            ;;
        esac
        asset="kigumi_${VERSION#v}_${os}_${arch}.tar.gz"
        dir="$RUNNER_TEMP/kigumi-prebuilt"
        mkdir -p "$dir"
        base="https://github.com/${REPOSITORY}/releases/download/${VERSION}"
        if ! curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -o "$dir/$asset" "$base/$asset"; then
          if [ "$MODE" = auto ]; then
            echo "::notice::prebuilt $asset is not published; building from source"
            exit 0
          fi
          echo "missing release asset $asset" >&2
          exit 1
        fi
        curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -o "$dir/$CHECKSUMS" "$base/$CHECKSUMS"
        ( cd "$dir" && awk -v a="$asset" '$2 == a { print }' "$CHECKSUMS" > selected.sums && test -s selected.sums && sha256sum -c selected.sums )
        tar -xzf "$dir/$asset" -C "$dir"
        binary=kigumi
        if [ "$os" = windows ]; then binary=kigumi.exe; fi
        test -f "$dir/$binary"
        got=$("$dir/$binary" --version)
        case "$got" in
          "kigumi version ${VERSION#v}"*) ;;
          *)
            echo "prebuilt $binary reports '$got', want version ${VERSION#v}" >&2
            exit 1
            ;;
        esac
        echo "dir=$dir" >> "$GITHUB_OUTPUT"
        echo "use=true" >> "$GITHUB_OUTPUT"
    - id: cache
      if: inputs.version != 'local' && steps.prebuilt.outputs.use != 'true'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/kigumi-bin
        key: kigumi-${{ runner.os }}-${{ runner.arch }}-go${{ inputs.go-version }}-${{ steps.resolve.outputs.commit }}
    - if: steps.prebuilt.outputs.use != 'true' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ steps.resolve.outputs.src }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/kigumi-bin"
        go build -trimpath -o "$RUNNER_TEMP/kigumi-bin/kigumi" .
    - id: install
      shell: bash
      env:
        USE_PREBUILT: ${{ steps.prebuilt.outputs.use }}
        PREBUILT_DIR: ${{ steps.prebuilt.outputs.dir }}
      run: |
        set -euo pipefail
        if [ "$USE_PREBUILT" = true ]; then
          dir="$PREBUILT_DIR"
          source=prebuilt
        else
          dir="$RUNNER_TEMP/kigumi-bin"
          source=source
        fi
        echo "$dir" >> "$GITHUB_PATH"
        echo "source=$source" >> "$GITHUB_OUTPUT"
    - if: inputs.zig-version != ''
      id: zig-cache
      uses: actions/cache@v4
      with:
        path: ~/.local/share/kigumi/zig
        key: kigumi-zig-${{ runner.os }}-${{ runner.arch }}-${{ inputs.zig-version }}
    - if: inputs.zig-version != ''
      shell: bash
      run: kigumi zig install "${{ inputs.zig-version }}"
    - shell: bash
      run: kigumi --version
